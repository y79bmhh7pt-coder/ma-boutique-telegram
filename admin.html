
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - LABO EXPRESS 57</title>
<style>
body{margin:0;padding:20px;background:#080808;color:white;font-family:Arial,sans-serif}
main{max-width:700px;margin:25px auto}
.card{background:#151515;border:1px solid #f5d000;border-radius:14px;padding:20px;margin-bottom:16px}
h1,h2{color:#f5d000}
input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:9px;font-size:15px}
input{background:#222;color:white;border:1px solid #555}
button{background:#f5d000;color:#111;border:0;font-weight:bold}
.order{border-top:1px solid #444;padding:12px 0;overflow-wrap:anywhere}
small{color:#bbb}
</style>
</head>
<body>
<main>
<section class="card">
<h1>LABO EXPRESS 57</h1>
<h2>Connexion administrateur</h2>
<form id="login">
<input id="email" type="email" placeholder="E-mail Supabase" required>
<input id="password" type="password" placeholder="Mot de passe" required>
<button>Se connecter</button>
</form>
<button id="logout" hidden>Se déconnecter</button>
<p id="message">Connecte-toi pour continuer.</p>
</section>
<section class="card" id="ordersCard" hidden>
<h2>Commandes</h2>
<button id="refresh">Actualiser les commandes</button>
<div id="orders"></div>
</section>
</main>
<script type="module">
import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://biiwpfqlpkchuejhstnn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cko3XQQSgcc2Xi0xiHFtCQ_u1k6ID8z';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
const message = document.querySelector('#message');
const loginForm = document.querySelector('#login');
const ordersCard = document.querySelector('#ordersCard');
const ordersDiv = document.querySelector('#orders');
const logout = document.querySelector('#logout');

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  message.textContent = 'Connexion...';

  const code = document.querySelector('#password').value;

const response = await fetch(
  'https://biiwpfqlpkchuejhstnn.supabase.co/functions/v1/admin-login',
  {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY
    },
    body: JSON.stringify({ code })
  }
);

const result = await response.json();

if (!response.ok || !result.success || !result.session) {
  message.textContent = result.message || 'Code administrateur refusé';
  return;
}

const { error } = await supabase.auth.setSession({
  access_token: result.session.access_token,
  refresh_token: result.session.refresh_token
});

  if (error) {
    message.textContent = 'Connexion impossible : ' + error.message;
    return;
  }

  await refreshOrders();
});

logout.addEventListener('click', async () => {
  await supabase.auth.signOut();
  ordersCard.hidden = true;
  logout.hidden = true;
  loginForm.hidden = false;
  message.textContent = 'Déconnecté.';
});

document.querySelector('#refresh').addEventListener('click', refreshOrders);

async function refreshOrders() {
  message.textContent = 'Vérification des droits...';

  const { data: userData, error: userError } =
    await supabase.auth.getUser();

  if (userError || !userData.user) {
    message.textContent = 'Connecte-toi pour continuer.';
    return;
  }

  const { data: admin, error: adminError } = await supabase
    .from('admin_access')
    .select('user_id')
    .eq('user_id', userData.user.id)
    .maybeSingle();

  if (adminError || !admin) {
    message.textContent = 'Accès administrateur refusé.';
    return;
  }

  loginForm.hidden = true;
  logout.hidden = false;
  ordersCard.hidden = false;

  const { data, error } = await supabase.rpc('admin_list_orders');

  if (error) {
    message.textContent = 'Erreur : ' + error.message;
    return;
  }

  ordersDiv.replaceChildren();

  if (!data || data.length === 0) {
    ordersDiv.textContent = 'Aucune commande enregistrée.';
  } else {
    for (const order of data) {
      const item = document.createElement('div');
      item.className = 'order';

      const title = document.createElement('strong');
      title.textContent = 'Commande ' + order.order_reference;

      const details = document.createElement('p');
      details.textContent =
        'Statut : ' + order.status +
        ' — Total : ' + (order.total_cents / 100).toFixed(2) + ' €';

      const points = document.createElement('small');
      points.textContent = 'Points attribués : ' + order.points_awarded;

      item.append(title, details, points);

      if (order.status === 'pending') {
        const validate = document.createElement('button');
        validate.textContent = 'Valider la commande';

        validate.addEventListener('click', async () => {
          const { data: sessionData } = await supabase.auth.getSession();
          const token = sessionData.session?.access_token;

          if (!token) {
            message.textContent = 'Reconnecte-toi.';
            return;
          }

          validate.disabled = true;

          const response = await fetch(
            SUPABASE_URL + '/functions/v1/admin-validate-order',
            {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token,
                'apikey': SUPABASE_KEY
              },
              body: JSON.stringify({
                order_reference: order.order_reference
              })
            }
          );

          const result = await response.json();

          if (!response.ok || !result.success) {
            message.textContent =
              'Validation impossible : ' +
              (result.error || result.details || 'erreur');
            validate.disabled = false;
            return;
          }

          message.textContent = 'Commande validée : 10 points attribués.';
          await refreshOrders();
        });

        item.append(validate);
      }

      ordersDiv.append(item);
    }
  }

  message.textContent = 'Panneau administrateur connecté.';
}

supabase.auth.onAuthStateChange((_event, session) => {
  if (!session) {
    ordersCard.hidden = true;
    logout.hidden = true;
    loginForm.hidden = false;
  }
});
</script>
</body>
</html>
