<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;padding:14px;background:#080808;color:#fff;font-family:Arial,sans-serif}
h1{color:#ffd400;text-align:center}
.card{background:#171717;border:1px solid #ffd40066;border-radius:14px;padding:12px;margin:12px 0}
button{padding:12px;border:0;border-radius:10px;font-weight:bold;font-size:15px}
.ok{background:#ffd400;color:#000}
.no{background:#333;color:#fff}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1}
.back{background:#ffd400;color:#000;margin-bottom:8px}
</style></head><body>
<button class="back" onclick="location.href='index.html'">← Retour</button>
<h1>👑 Admin · Commandes</h1>
<div id="list">Chargement...</div>
<script>
const API = "https://sdjbcjyrougwgrcgdnkr.supabase.co/functions/v1/api";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

async function api(action, data = {}) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, initData: tg ? tg.initData : "", ...data })
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Erreur");
  return j;
}

async function load() {
  const list = document.getElementById("list");
  try {
    const orders = await api("admin_orders");
    list.innerHTML = "";
    if (!orders.length) { list.textContent = "Aucune commande en attente."; return; }
    orders.forEach(o => {
      const c = document.createElement("div");
      c.className = "card";
      const t = document.createElement("div");
      t.style.whiteSpace = "pre-line";
      let txt = "Commande #" + o.id + " · " + Number(o.total).toFixed(2) + " €\n";
      (o.items || []).forEach(i => { txt += "- " + i.name + " · " + i.q + " g · " + i.price + " €\n"; });
      txt += "Mode : " + (o.mode || "-");
      if (o.address) txt += "\nAdresse : " + o.address;
      txt += "\nClient ID : " + o.telegram_id;
      t.textContent = txt;
      c.appendChild(t);
      const r = document.createElement("div");
      r.className = "row";
      const v = document.createElement("button");
      v.className = "ok";
      v.textContent = "✅ Valider";
      v.onclick = () => act("admin_validate", o.id);
      const n = document.createElement("button");
      n.className = "no";
      n.textContent = "❌ Annuler";
      n.onclick = () => act("admin_cancel", o.id);
      r.append(v, n);
      c.appendChild(r);
      list.appendChild(c);
    });
  } catch (e) {
    list.textContent = "Erreur : " + e.message;
  }
}

async function act(action, id) {
  if (!confirm("Confirmer ?")) return;
  try { await api(action, { order_id: id }); }
  catch (e) { alert(e.message); }
  load();
}
load();
</script>
</body></html>
