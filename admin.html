<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;padding:14px;background:#080808;color:#fff;font-family:Arial,sans-serif}
h1{color:#ffd400;text-align:center;margin:8px 0}
.card{background:#171717;border:1px solid #ffd40066;border-radius:14px;padding:12px;margin:12px 0}
button{padding:12px;border:0;border-radius:10px;font-weight:bold;font-size:15px}
.ok{background:#ffd400;color:#000}
.no{background:#333;color:#fff}
.del{background:#7a1f1f;color:#fff}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1}
.back{background:#ffd400;color:#000}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tabs button{flex:1 1 30%;background:#333;color:#fff;padding:12px 2px;font-size:13px}
.tabs button.on{background:#ffd400;color:#000}
input,select{width:100%;padding:12px;margin:4px 0 10px;border-radius:10px;border:0;font-size:15px;background:#fff;color:#000;box-sizing:border-box}
textarea{width:100%;padding:12px;margin:4px 0 10px;border-radius:10px;border:0;font-size:15px;background:#fff;color:#000;box-sizing:border-box;font-family:inherit}
input[type=color]{height:46px;padding:4px}
label{font-size:13px;opacity:.8}
.small{font-size:13px;opacity:.7}
.warn{background:#7a1f1f;border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.swatch{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid #fff;vertical-align:middle;margin-right:6px}
#form,#wForm{display:none}
#preview{max-width:100%;max-height:160px;border-radius:10px;display:none;margin-bottom:8px}
</style></head><body>
<button class="back" onclick="location.href='index.html'">← Retour</button>
<h1>👑 Admin</h1>
<div class="tabs">
  <button id="tabOrders" class="on" onclick="show('orders')">Commandes</button>
  <button id="tabProducts" onclick="show('products')">Produits</button>
  <button id="tabClients" onclick="show('clients')">Clients</button>
  <button id="tabWheel" onclick="show('wheel')">Roue</button>
  <button id="tabHistory" onclick="show('history')">Historique</button>
</div>

<div id="ordersView"><div id="oList">Chargement...</div></div>

<div id="productsView" style="display:none">
  <button class="ok" style="width:100%" onclick="openForm()">➕ Nouveau produit</button>
  <div id="form" class="card">
    <h3 id="formTitle" style="margin-top:0">Produit</h3>
    <input type="hidden" id="fId"><input type="hidden" id="fCode"><input type="hidden" id="fImg">
    <label>Nom</label><input id="fName" placeholder="Nom du produit">
    <label>Catégorie</label>
    <select id="fCat"><option value="1">Catégorie 1</option><option value="2">Catégorie 2</option></select>
    <label>Disponibilité</label>
    <select id="fStatus">
      <option value="disponible">Disponible</option>
      <option value="rupture">Rupture</option>
      <option value="bientot">Bientôt disponible</option>
    </select>
    <label>Quantités et prix (quantité=prix, séparés par ;)</label>
    <input id="fOpts" placeholder="1=10 ; 3=28 ; 5=45">
    <label>Photo</label>
    <img id="preview" alt="">
    <input type="file" id="fFile" accept="image/*" onchange="onFile(event)">
    <label>Vidéo (nom du fichier, facultatif)</label>
    <input id="fVideo" placeholder="video1.mp4">
    <label>Description du produit</label>
    <textarea id="fDesc" rows="5" placeholder="Goût, effet, origine, conseils..."></textarea>
    <div id="fMsg" class="small"></div>
    <div class="row">
      <button class="ok" onclick="saveProduct()">💾 Enregistrer</button>
      <button class="no" onclick="closeForm()">Annuler</button>
    </div>
  </div>
  <div id="pList">Chargement...</div>
</div>

<div id="clientsView" style="display:none">
  <input id="cSearch" placeholder="🔍 Chercher un @pseudo ou un ID" oninput="renderClients()">
  <div id="cCount" class="small"></div>
  <div id="cList">Chargement...</div>
</div>

<div id="wheelView" style="display:none">
  <div class="card">
    <h3 style="margin-top:0">⚙️ Réglages</h3>
    <label>Points pour un tour de roue</label>
    <input id="sCost" type="number" min="1" step="1">
    <label>Points gagnés par euro dépensé</label>
    <input id="sRatio" type="number" min="0.1" step="0.1">
    <button class="ok" style="width:100%" onclick="saveSettings()">💾 Enregistrer les réglages</button>
    <div id="sMsg" class="small" style="margin-top:8px"></div>
  </div>

  <button class="ok" style="width:100%" onclick="openPrize()">➕ Nouveau lot</button>
  <div id="wForm" class="card">
    <h3 id="wTitle" style="margin-top:0">Lot</h3>
    <input type="hidden" id="wId">
    <label>Nom du lot (12 caractères environ)</label>
    <input id="wLabel" placeholder="-10 €">
    <label>Poids (plus il est grand, plus le lot tombe souvent)</label>
    <input id="wWeight" type="number" min="0" step="1" placeholder="10">
    <label>Couleur de la case</label>
    <input id="wColor" type="color" value="#c99a00">
    <label>Couleur du texte</label>
    <input id="wText" type="color" value="#000000">
    <label>État</label>
    <select id="wActive"><option value="1">Actif</option><option value="0">Désactivé</option></select>
    <div class="row">
      <button class="ok" onclick="savePrize()">💾 Enregistrer</button>
      <button class="no" onclick="closePrize()">Annuler</button>
    </div>
  </div>
  <div id="wList">Chargement...</div>
</div>

<div id="historyView" style="display:none">
  <select id="hFilter" onchange="loadHistory()">
    <option value="">Toutes (validées et annulées)</option>
    <option value="validee">Validées seulement</option>
    <option value="annulee">Annulées seulement</option>
  </select>
  <div id="hSummary" class="small"></div>
  <div id="hList">Chargement...</div>
</div>

<script>
const API = "https://sdjbcjyrougwgrcgdnkr.supabase.co/functions/v1/api";
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

async function api(action, data = {}) {
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, initData: tg ? tg.initData : "", ...data })
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Erreur");
  return j;
}
const $ = id => document.getElementById(id);

function show(t) {
  ["orders", "products", "clients", "wheel", "history"].forEach(n => {
    $(n + "View").style.display = n === t ? "block" : "none";
    $("tab" + n.charAt(0).toUpperCase() + n.slice(1)).className = n === t ? "on" : "";
  });
  if (t === "orders") loadOrders();
  else if (t === "products") loadProducts();
  else if (t === "clients") loadClients();
  else if (t === "wheel") loadWheel();
  else loadHistory();
}

/* ---------- COMMANDES ---------- */
async function loadOrders() {
  const list = $("oList");
  try {
    const orders = await api("admin_orders");
    list.innerHTML = "";
    if (!orders.length) { list.textContent = "Aucune commande en attente."; return; }
    orders.forEach(o => {
      const c = document.createElement("div");
      c.className = "card";
      const t = document.createElement("div");
      t.style.whiteSpace = "pre-line";
      let txt = "Commande #" + o.id + " · " + Number(o.total).toFixed(2) + " €\n";
      (o.items || []).forEach(i => { txt += "- " + i.name + " · " + i.q + " g · " + i.price + " €\n"; });
      txt += "Mode : " + (o.mode || "-");
      if (o.address) txt += "\nAdresse : " + o.address;
      if (o.bon) txt += "\n🎡🎁 Gain à offrir : " + o.bon;
      txt += "\nClient ID : " + o.telegram_id;
      t.textContent = txt;
      c.appendChild(t);
      const r = document.createElement("div");
      r.className = "row";
      const v = document.createElement("button");
      v.className = "ok"; v.textContent = "✅ Valider";
      v.onclick = () => actOrder("admin_validate", o.id);
      const n = document.createElement("button");
      n.className = "no"; n.textContent = "❌ Annuler";
      n.onclick = () => actOrder("admin_cancel", o.id);
      r.append(v, n);
      c.appendChild(r);
      list.appendChild(c);
    });
  } catch (e) { list.textContent = "Erreur : " + e.message; }
}
async function actOrder(action, id) {
  if (!confirm("Confirmer ?")) return;
  try { await api(action, { order_id: id }); } catch (e) { alert(e.message); }
  loadOrders();
}

/* ---------- PRODUITS ---------- */
let PRODUCTS = [];
const STATUS = { disponible: "Disponible", rupture: "Rupture", bientot: "Bientôt" };

function optsToText(o) { return (o || []).map(x => x.q + "=" + x.p).join(" ; "); }
function textToOpts(t) {
  return t.split(";").map(s => s.trim()).filter(Boolean).map(s => {
    const [q, p] = s.split("=");
    return { q: String(q).trim().replace(",", "."), p: Number(String(p).trim().replace(",", ".")) };
  }).filter(o => o.q && !isNaN(o.p));
}

async function loadProducts() {
  const list = $("pList");
  try {
    PRODUCTS = await api("products");
    list.innerHTML = "";
    if (!PRODUCTS.length) { list.textContent = "Aucun produit."; return; }
    PRODUCTS.forEach(p => {
      const c = document.createElement("div");
      c.className = "card";
      const t = document.createElement("div");
      t.style.whiteSpace = "pre-line";
      t.textContent = p.name + "\nCatégorie " + p.category + " · " + optsToText(p.options);
      c.appendChild(t);
      const s = document.createElement("select");
      Object.keys(STATUS).forEach(k => {
        const o = document.createElement("option");
        o.value = k; o.textContent = STATUS[k];
        if (p.status === k) o.selected = true;
        s.appendChild(o);
      });
      s.onchange = async () => {
        try { await api("admin_save_product", { product: { ...p, status: s.value } }); }
        catch (e) { alert(e.message); }
        loadProducts();
      };
      c.appendChild(s);
      const r = document.createElement("div");
      r.className = "row";
      const e = document.createElement("button");
      e.className = "ok"; e.textContent = "✏️ Modifier";
      e.onclick = () => openForm(p);
      const d = document.createElement("button");
      d.className = "del"; d.textContent = "🗑 Supprimer";
      d.onclick = async () => {
        if (!confirm("Supprimer " + p.name + " ?")) return;
        try { await api("admin_delete_product", { id: p.id }); } catch (er) { alert(er.message); }
        loadProducts();
      };
      r.append(e, d);
      c.appendChild(r);
      list.appendChild(c);
    });
  } catch (e) { list.textContent = "Erreur : " + e.message; }
}

function openForm(p) {
  p = p || {};
  $("formTitle").textContent = p.id ? "Modifier le produit" : "Nouveau produit";
  $("fId").value = p.id || "";
  $("fCode").value = p.code || "";
  $("fImg").value = p.image_url || "";
  $("fName").value = p.name || "";
  $("fCat").value = String(p.category || 1);
  $("fStatus").value = p.status || "disponible";
  $("fOpts").value = optsToText(p.options);
  $("fVideo").value = p.video_url || "";
  $("fDesc").value = p.description || "";
  $("fMsg").textContent = "";
  $("fFile").value = "";
  const pv = $("preview");
  if (p.image_url) { pv.src = p.image_url; pv.style.display = "block"; } else { pv.style.display = "none"; }
  $("form").style.display = "block";
  $("form").scrollIntoView({ behavior: "smooth" });
}
function closeForm() { $("form").style.display = "none"; }

function resizeImage(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    };
    img.onerror = () => reject(new Error("image illisible"));
    img.src = url;
  });
}
async function onFile(ev) {
  const f = ev.target.files[0];
  if (!f) return;
  $("fMsg").textContent = "Envoi de l'image...";
  try {
    const data = await resizeImage(f, 900);
    const r = await api("admin_upload_image", { data, ext: "jpg", type: "image/jpeg" });
    $("fImg").value = r.url;
    $("preview").src = r.url;
    $("preview").style.display = "block";
    $("fMsg").textContent = "Image envoyée ✓";
  } catch (e) { $("fMsg").textContent = "Erreur image : " + e.message; }
}

async function saveProduct() {
  const name = $("fName").value.trim();
  if (!name) { alert("Entre un nom."); return; }
  const options = textToOpts($("fOpts").value);
  if (!options.length) { alert("Entre au moins une quantité, par exemple 1=10"); return; }
  const product = {
    id: $("fId").value || null,
    code: $("fCode").value || null,
    name,
    category: Number($("fCat").value),
    status: $("fStatus").value,
    options,
    image_url: $("fImg").value || null,
    video_url: $("fVideo").value.trim() || null,
    description: $("fDesc").value.trim() || null
  };
  try {
    await api("admin_save_product", { product });
    closeForm();
    loadProducts();
  } catch (e) { alert(e.message); }
}

/* ---------- CLIENTS ---------- */
let CLIENTS = [];

function fmtDate(d) { return d ? new Date(d).toLocaleDateString("fr-FR") : "-"; }
function fmtEuro(n) { return Number(n || 0).toFixed(2).replace(".", ",") + " €"; }

async function loadClients() {
  try {
    CLIENTS = await api("admin_customers");
    renderClients();
  } catch (e) { $("cList").textContent = "Erreur : " + e.message; }
}

function renderClients() {
  const list = $("cList");
  const q = $("cSearch").value.trim().toLowerCase().replace(/^@/, "");
  const shown = CLIENTS.filter(c =>
    !q || String(c.telegram_id).includes(q) || (c.username || "").toLowerCase().includes(q));
  $("cCount").textContent = shown.length + " client(s) sur " + CLIENTS.length;
  list.innerHTML = "";
  if (!shown.length) { list.textContent = "Aucun client."; return; }
  shown.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    const t = document.createElement("div");
    t.style.whiteSpace = "pre-line";
    t.textContent =
      (c.username ? "@" + c.username : "(sans pseudo)") + "\n" +
      "ID : " + c.telegram_id + "\n" +
      "⭐ " + c.points + " points\n" +
      "🛒 " + c.orders + " commande(s) · " + fmtEuro(c.spent) + "\n" +
      "Dernière commande : " + fmtDate(c.last) + "\n" +
      "Inscrit le : " + fmtDate(c.created_at);
    card.appendChild(t);
    const r = document.createElement("div");
    r.className = "row";
    const plus = document.createElement("button");
    plus.className = "ok"; plus.textContent = "+50";
    plus.onclick = () => changePoints(c, { delta: 50 });
    const minus = document.createElement("button");
    minus.className = "no"; minus.textContent = "-50";
    minus.onclick = () => changePoints(c, { delta: -50 });
    const other = document.createElement("button");
    other.className = "no"; other.textContent = "Autre...";
    other.onclick = () => {
      const v = prompt("Nouveau total de points pour " + (c.username ? "@" + c.username : c.telegram_id) + " :", c.points);
      if (v === null || v.trim() === "" || isNaN(Number(v))) return;
      changePoints(c, { set: Number(v) });
    };
    r.append(plus, minus, other);
    card.appendChild(r);
    list.appendChild(card);
  });
}

async function changePoints(c, body) {
  try { await api("admin_points", { telegram_id: c.telegram_id, ...body }); }
  catch (e) { alert(e.message); }
  loadClients();
}

/* ---------- ROUE ---------- */
let PRIZES = [];

async function loadWheel() {
  try {
    const s = await api("admin_settings");
    $("sCost").value = s.wheel_cost;
    $("sRatio").value = s.points_per_euro;
    PRIZES = await api("admin_prizes");
    renderPrizes();
  } catch (e) { $("wList").textContent = "Erreur : " + e.message; }
}

async function saveSettings() {
  try {
    await api("admin_save_settings", {
      wheel_cost: Number($("sCost").value),
      points_per_euro: Number($("sRatio").value)
    });
    $("sMsg").textContent = "Réglages enregistrés ✓";
  } catch (e) { $("sMsg").textContent = "Erreur : " + e.message; }
}

function renderPrizes() {
  const list = $("wList");
  list.innerHTML = "";
  const total = PRIZES.filter(p => p.active).reduce((s, p) => s + p.weight, 0);
  if (!PRIZES.length) { list.textContent = "Aucun lot."; return; }
  if (total <= 0) {
    const w = document.createElement("div");
    w.className = "warn";
    w.textContent = "⚠️ Aucun lot actif avec un poids supérieur à 0 : la roue ne peut pas tourner.";
    list.appendChild(w);
  }
  PRIZES.forEach(p => {
    const c = document.createElement("div");
    c.className = "card";
    const pct = p.active && total > 0 ? (p.weight * 100 / total).toFixed(1).replace(".", ",") + " %" : "0 %";
    const t = document.createElement("div");
    t.style.whiteSpace = "pre-line";
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.background = p.color;
    t.appendChild(sw);
    t.appendChild(document.createTextNode(
      p.label + "\nPoids " + p.weight + " · Chance : " + pct + (p.active ? "" : "\n(désactivé)")));
    c.appendChild(t);
    const r = document.createElement("div");
    r.className = "row";
    const e = document.createElement("button");
    e.className = "ok"; e.textContent = "✏️";
    e.onclick = () => openPrize(p);
    const a = document.createElement("button");
    a.className = "no"; a.textContent = p.active ? "⏸ Désactiver" : "▶️ Activer";
    a.onclick = async () => {
      try { await api("admin_save_prize", { prize: { ...p, active: !p.active } }); }
      catch (er) { alert(er.message); }
      loadWheel();
    };
    const d = document.createElement("button");
    d.className = "del"; d.textContent = "🗑";
    d.onclick = async () => {
      if (!confirm("Supprimer le lot « " + p.label + " » ?")) return;
      try { await api("admin_delete_prize", { id: p.id }); } catch (er) { alert(er.message); }
      loadWheel();
    };
    r.append(e, a, d);
    c.appendChild(r);
    list.appendChild(c);
  });
}

function openPrize(p) {
  p = p || {};
  $("wTitle").textContent = p.id ? "Modifier le lot" : "Nouveau lot";
  $("wId").value = p.id || "";
  $("wLabel").value = p.label || "";
  $("wWeight").value = p.weight !== undefined ? p.weight : 10;
  $("wColor").value = p.color || "#c99a00";
  $("wText").value = p.text_color || "#000000";
  $("wActive").value = p.active === false ? "0" : "1";
  $("wForm").style.display = "block";
  $("wForm").scrollIntoView({ behavior: "smooth" });
}
function closePrize() { $("wForm").style.display = "none"; }

async function savePrize() {
  const label = $("wLabel").value.trim();
  if (!label) { alert("Entre un nom de lot."); return; }
  const prize = {
    id: $("wId").value || null,
    label,
    weight: Number($("wWeight").value),
    color: $("wColor").value,
    text_color: $("wText").value,
    active: $("wActive").value === "1"
  };
  try {
    await api("admin_save_prize", { prize });
    closePrize();
    loadWheel();
  } catch (e) { alert(e.message); }
}

/* ---------- HISTORIQUE ---------- */
function fmtDateTime(d) {
  return d ? new Date(d).toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "-";
}

async function loadHistory() {
  const list = $("hList");
  try {
    const hist = await api("admin_history", { status: $("hFilter").value });
    const ok = hist.filter(o => o.status === "validee");
    const sum = ok.reduce((s, o) => s + Number(o.total), 0);
    $("hSummary").textContent =
      hist.length + " commande(s) · " + ok.length + " validée(s) · " + fmtEuro(sum) + " encaissés";
    list.innerHTML = "";
    if (!hist.length) { list.textContent = "Aucune commande."; return; }
    hist.forEach(o => {
      const c = document.createElement("div");
      c.className = "card";
      const t = document.createElement("div");
      t.style.whiteSpace = "pre-line";
      let txt = (o.status === "validee" ? "✅ Validée" : "❌ Annulée") +
        " · #" + o.id + " · " + fmtEuro(o.total) + "\n" +
        fmtDateTime(o.created_at) + " · " +
        (o.username ? "@" + o.username : "ID " + o.telegram_id) + "\n";
      (o.items || []).forEach(i => { txt += "- " + i.name + " · " + i.q + " g · " + i.price + " €\n"; });
      txt += "Mode : " + (o.mode || "-");
      if (o.address) txt += "\nAdresse : " + o.address;
      if (o.bon) txt += "\n🎡🎁 Gain utilisé : " + o.bon;
      if (o.status === "validee") txt += "\n⭐ " + o.points_given + " points donnés";
      t.textContent = txt;
      c.appendChild(t);
      list.appendChild(c);
    });
  } catch (e) { list.textContent = "Erreur : " + e.message; }
}

loadOrders();
</script>
</body></html>
