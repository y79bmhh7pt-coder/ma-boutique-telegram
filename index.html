
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma boutique</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --yellow: #ffd400;
  --black: #080808;
  --panel: #171717;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: white;
  background: #080808;
  background-image: linear-gradient(#0009,#000d),
    url("fond.jpg");
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 25px 12px;
}
h1 { color: var(--yellow); margin: 0; }
h2 { font-size: 21px; }
main { max-width: 700px; margin: auto; padding: 12px; }
button, select {
  padding: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 15px;
}
button {
  background: var(--yellow);
  color: black;
  font-weight: bold;
  cursor: pointer;
}
.back { margin-bottom: 14px; }
.categories {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.category {
  min-height: 155px;
  display: flex;
  align-items: end;
  justify-content: center;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid #ffffff30;
  background-position: center;
  background-size: cover;
  text-shadow: 0 2px 6px black;
}
.category span {
  background: #000b;
  padding: 9px;
  border-radius: 8px;
}
.card, .cart {
  background: #171717ee;
  border: 1px solid #ffffff20;
  border-radius: 15px;
  padding: 13px;
  margin: 12px 0;
}
video {
  display: block;
  width: 100%;
  max-height: 320px;
  background: #000;
  border-radius: 10px;
  object-fit: contain;
}
select { width: 100%; margin: 10px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions button { flex: 1; }
.total { color: var(--yellow); font-size: 21px; font-weight: bold; }
input {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border-radius: 9px;
  border: 1px solid #555;
  background: #101010;
  color: white;
}
.hidden { display: none !important; }
.small { color: #ccc; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>LAbo express 57</h1>
  <p>Choisis tes produits et passe commande</p>
</header>

<main>
  <section id="home">
    <h2>Nos catégories</h2>
    <div class="categories">
      <button class="category"
        style="background-image:linear-gradient(#0002,#0008),url('categorie1.jpg')"
        onclick="openCategory(1)">
        <span>LABO Hash🍫🍀</span>
      </button>
      <button class="category"
        style="background-image:linear-gradient(#0002,#0008),url('categorie2.jpg')"
        onclick="openCategory(2)">
        <span>LAbo mash❄️</span>
      </button>
    </div>
  </section>

  <section id="products" class="hidden">
    <button class="back" onclick="showHome()">← Retour</button>
    <h2 id="categoryTitle"></h2>
    <div id="productList"></div>
  </section>

  <section id="cartSection" class="cart">
    <h2>🛒 Mon panier</h2>
    <div id="cartItems">Ton panier est vide.</div>
    <p class="total">Total : <span id="total">0,00</span> €</p>
    <button onclick="checkout()">Commander</button>
  </section>

  <section id="checkoutSection" class="cart hidden">
    <button class="back" onclick="showCart()">← Retour au panier</button>
    <h2>📦 Mode de commande</h2>
    <label><input type="radio" name="mode" value="Livraison"
      onchange="toggleAddress()"> Livraison</label>
    <label><input type="radio" name="mode" value="Sur place"
      onchange="toggleAddress()"> Sur place</label>
    <div id="addressBox" class="hidden">
      <label>Adresse de livraison</label>
      <input id="address" placeholder="Ton adresse">
      <label>Précisions (facultatif)</label>
      <input id="details" placeholder="Bâtiment, étage...">
    </div>
    <button onclick="sendOrder()">Confirmer ma commande sur Telegram</button>
    <p class="small">La commande sera préparée pour être envoyée dans Telegram.</p>
  </section>
</main>

<script>
const SELLER_USERNAME = "TON_PSEUDO_TELEGRAM";

const products = {
  1: [
    { id:"p1", name:"Jaune", video:"video1.mp4",
      options:[{q:4,p:20},{q:10,p:50},{q:25,p:150}] },
    { id:"p2", name:"Filtre", video:"video2.mp4",
      options:[{q:2.5,p:20},{q:5,p:40},{q:10,p:70}] },
    { id:"p3", name:"Amnésia", video:"video3.mp4",
      options:[{q:2,p:20},{q:5,p:50},{q:10,p:80}] }
  ],
  2: [
    { id:"p4", name:"Produit 4", video:"video4.mp4",
      options:[{q:1,p:10},{q:2,p:20},{q:3,p:30},
               {q:4,p:40},{q:5,p:50}] }
  ]
};

let cart = [];

function money(n) {
  return Number(n).toLocaleString("fr-FR", {
    minimumFractionDigits:2, maximumFractionDigits:2
  });
}

function openCategory(number) {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("products").classList.remove("hidden");
  document.getElementById("categoryTitle").textContent =
    number === 1 ? "Catégorie 1" : "Catégorie 2";

  const list = document.getElementById("productList");
  list.innerHTML = "";

  products[number].forEach(product => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = product.name;

    const video = document.createElement("video");
    video.controls = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.src = product.video;

    const select = document.createElement("select");
    product.options.forEach((option, index) => {
      const item = document.createElement("option");
      item.value = index;
      item.textContent =
        option.q + " — " + money(option.p) + " €";
      select.appendChild(item);
    });

    const add = document.createElement("button");
    add.textContent = "Ajouter au panier";
    add.onclick = () => {
      const option = product.options[Number(select.value)];
      cart.push({
        id: product.id,
        name: product.name,
        q: option.q,
        price: option.p
      });
      renderCart();
      add.textContent = "Ajouté ✓";
      setTimeout(() => add.textContent = "Ajouter au panier", 1200);
    };

    card.append(title, video, select, add);
    list.appendChild(card);
  });
}

function showHome() {
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("products").classList.add("hidden");
}

function renderCart() {
  const box = document.getElementById("cartItems");
  box.innerHTML = "";

  if (!cart.length) {
    box.textContent = "Ton panier est vide.";
  } else {
    cart.forEach((item, index) => {
      const line = document.createElement("p");
      line.textContent = item.name + " — quantité " + item.q +
        " — " + money(item.price) + " € ";

      const remove = document.createElement("button");
      remove.textContent = "Retirer";
      remove.onclick = () => {
        cart.splice(index, 1);
        renderCart();
      };

      line.appendChild(remove);
      box.appendChild(line);
    });
  }

  document.getElementById("total").textContent =
    money(cart.reduce((sum, item) => sum + item.price, 0));
}

function checkout() {
  if (!cart.length) {
    alert("Ajoute au moins un produit au panier.");
    return;
  }
  document.getElementById("checkoutSection").classList.remove("hidden");
  document.getElementById("checkoutSection").scrollIntoView({
    behavior:"smooth"
  });
}

function showCart() {
  document.getElementById("checkoutSection").classList.add("hidden");
}

function toggleAddress() {
  const mode = document.querySelector('input[name="mode"]:checked');
  document.getElementById("addressBox").classList.toggle(
    "hidden", !mode || mode.value !== "Livraison"
  );
}

function sendOrder() {
  if (!cart.length) {
    alert("Ton panier est vide.");
    return;
  }

  const mode = document.querySelector('input[name="mode"]:checked');
  if (!mode) {
    alert("Choisis livraison ou sur place.");
    return;
  }

  const address = document.getElementById("address").value.trim();
  if (mode.value === "Livraison" && !address) {
    alert("Entre ton adresse de livraison.");
    return;
  }

  let message = "Bonjour, je souhaite passer commande :\n\n";
  cart.forEach(item => {
    message += "• " + item.name + " — quantité " + item.q +
      " — " + money(item.price) + " €\n";
  });
  message += "\nTotal : " +
    money(cart.reduce((sum, item) => sum + item.price, 0)) + " €";
  message += "\nMode : " + mode.value;

  if (mode.value === "Livraison") {
    message += "\nAdresse : " + address;
    const details = document.getElementById("details").value.trim();
    if (details) message += "\nPrécisions : " + details;
  }

  if (SELLER_USERNAME === "TON_PSEUDO_TELEGRAM") {
    alert("Le site est prêt à être configuré. Il faut encore renseigner le pseudo Telegram du vendeur.");
    return;
  }

  const url = "https://t.me/" + SELLER_USERNAME.replace("@","") +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}

renderCart();
</script>
</body>
</html>
