<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LABO EXPRESS 57</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --yellow: #ffd400;
  --black: #080808;
  --panel: #171717;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: white;
  background: #080808;
  background-image: linear-gradient(#0009,#000d), url("tmax.png.PNG");
  background-position: center;
  background-size: cover;
  background-attachment: fixed;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 25px 12px;
}
h1 { color: var(--yellow); margin: 0; }
h2 { font-size: 21px; }
main {
  max-width: 700px;
  margin: auto;
  padding: 12px;
}
button, select {
  padding: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 15px;
}
button {
  background: var(--yellow);
  color: black;
  font-weight: bold;
  cursor: pointer;
}
.back { margin-bottom: 14px; }
.categories {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.category {
  min-height: 155px;
  display: flex;
  align-items: end;
  justify-content: center;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid #ffffff30;
  background-position: center;
  background-size: cover;
  text-shadow: 0 2px 6px black;
}
.category span {
  background: #000b;
  padding: 9px;
  border-radius: 8px;
}
.card, .cart {
  background: #171717ee;
  border: 1px solid #ffffff20;
  border-radius: 15px;
  padding: 13px;
  margin: 12px 0;
}
video {
  display: block;
  width: 100%;
  max-height: 320px;
  background: #000;
  border-radius: 10px;
  object-fit: contain;
}
select {
  width: 100%;
  margin: 10px 0;
  background: white;
  color: black;
}
.card button { width: 100%; }
.cart-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 12px 0;
  padding-bottom: 10px;
  border-bottom: 1px solid #444;
}
.cart-line span { overflow-wrap: anywhere; }
.cart-line button {
  flex-shrink: 0;
  padding: 8px;
  background: #333;
  color: white;
}
.total {
  color: var(--yellow);
  font-size: 21px;
  font-weight: bold;
}
input:not([type="radio"]) {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border-radius: 9px;
  border: 1px solid #555;
  background: #101010;
  color: white;
}
input[type="radio"] { accent-color: var(--yellow); }
label { display: block; margin: 12px 0; }
.small { color: #ccc; font-size: 13px; }
.hidden { display: none !important; }
#cartSection > button,
#checkoutSection > button:last-of-type {
  width: 100%;
}
@media (max-width: 380px) {
  .categories { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>LABO EXPRESS 57</h1>
  <p>Choisis tes produits et passe commande</p>
</header>
<main>
  <section id="home">
    <h2>Nos catégories</h2>
    <div class="categories">
      <button class="category"
        style="background-image:linear-gradient(#0002,#0008),url('categorie1.jpg.JPG')"
        onclick="openCategory(1)">
        <span>LABO HASH🍫🍀</span>
      </button>
      <button class="category"
        style="background-image:linear-gradient(#0002,#0008),url('categorie2.jpg.JPG')"
        onclick="openCategory(2)">
        <span>LABO MASH❄️</span>
      </button>
    </div>
  </section>
  <section id="products" class="hidden">
    <button class="back" onclick="showHome()">← Retour</button>
    <h2 id="categoryTitle"></h2>
    <div id="productList"></div>
  </section>
  <section id="cartSection" class="cart">
    <h2>🛒 Mon panier</h2>
    <div id="cartItems">Ton panier est vide.</div>
    <p class="total">Total : <span id="total">0,00</span> €</p>
    <button onclick="checkout()">Commander</button>
  </section>
  <section id="checkoutSection" class="cart hidden">
    <button class="back" onclick="showCart()">← Retour au panier</button>
    <h2>📦 Mode de commande</h2>
    <label>
      <input type="radio" name="mode" value="Livraison"
        onchange="toggleAddress()">
      Livraison
    </label>
    <label>
      <input type="radio" name="mode" value="Retrait sur place"
        onchange="toggleAddress()">
      Retrait sur place
    </label>
    <div id="addressBox" class="hidden">
      <label for="address">Adresse de livraison</label>
      <input id="address" placeholder="Ton adresse">
      <label for="details">Précisions (facultatif)</label>
      <input id="details" placeholder="Bâtiment, étage...">
    </div>
    <button onclick="sendOrder()">Préparer la commande dans Telegram</button>
    <p class="small">
      Vérifie ta commande avant de l'envoyer dans Telegram.
    </p>
  </section>
</main>
<script>
const SELLER_USERNAME = "pschauffer";
/* PRODUITS ET PRIX MODIFIABLES */
const products = {
  1: [
    {
      id: "p1",
      name: "Jaune🪵",
      video: "Video🪵.MOV",
      options: [
        { q: 4, p: 20 },
        { q: 10, p: 50 },
        { q: 25, p: 100 }
      ]
    },
    {
      id: "p2",
      name: "FILTRE🍫",
      video: "Video🍫.MOV",
      options: [
        { q: 2.5, p: 20 },
        { q: 5, p: 40 },
        { q: 10, p: 70 }
      ]
    },
    {
      id: "p3",
      name: "Amnesia🍀",
      video: "Video🍀.MOV",
      options: [
        { q: 2, p: 20 },
        { q: 5, p: 50 },
        { q: 10, p: 80 }
      ]
    }
  ],
  2: [
    {
      id: "p4",
      name: "COCO❄️🐟",
      video: "Video❄️.MOV",
      options: [
        { q: 0.15, p: 10 },
        { q: 0.5, p: 30 },
        { q: 1, p: 50 },
        { q: 5, p: 240 },
        { q: 10, p: 480 }
      ]
    }
  ]
};
let cart = [];
function money(n) {
  return Number(n).toLocaleString("fr-FR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}
function openCategory(number) {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("products").classList.remove("hidden");
  document.getElementById("categoryTitle").textContent =
    number === 1 ? "Catégorie 1" : "Catégorie 2";
  const list = document.getElementById("productList");
  list.innerHTML = "";
  products[number].forEach(product => {
    const card = document.createElement("div");
    card.className = "card";
    const title = document.createElement("h2");
    title.textContent = product.name;
    const video = document.createElement("video");
    video.controls = true;
    video.playsInline = true;
    video.preload = "metadata";
    video.src = product.video;
    video.onerror = () => {
      video.style.display = "none";
      const warning = document.createElement("p");
      warning.className = "small";
      warning.textContent =
        "Vidéo introuvable : vérifie le nom du fichier sur GitHub.";
      card.insertBefore(warning, select);
    };
    const select = document.createElement("select");
    select.setAttribute("aria-label", "Choisir une quantité et un prix");
    product.options.forEach((option, index) => {
      const item = document.createElement("option");
      item.value = index;
      item.textContent =
        option.q + " gramme(s) — " + money(option.p) + " €";
      select.appendChild(item);
    });
    const add = document.createElement("button");
    add.textContent = "Ajouter au panier";
    add.onclick = () => {
      const option = product.options[Number(select.value)];
      cart.push({
        id: product.id,
        name: product.name,
        q: option.q,
        price: option.p
      });
      renderCart();
      add.textContent = "Ajouté ✓";
      setTimeout(() => {
        add.textContent = "Ajouter au panier";
      }, 1000);
    };
    card.append(title, video, select, add);
    list.appendChild(card);
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function showHome() {
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("products").classList.add("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function renderCart() {
  const box = document.getElementById("cartItems");
  box.innerHTML = "";
  if (cart.length === 0) {
    box.textContent = "Ton panier est vide.";
  } else {
    cart.forEach((item, index) => {
      const line = document.createElement("div");
      line.className = "cart-line";
      const text = document.createElement("span");
      text.textContent =
        item.name + " — " + item.q + " gramme(s) — " +
        money(item.price) + " €";
      const remove = document.createElement("button");
      remove.textContent = "Retirer";
      remove.onclick = () => {
        cart.splice(index, 1);
        renderCart();
      };
      line.append(text, remove);
      box.appendChild(line);
    });
  }
  const total = cart.reduce((sum, item) => sum + item.price, 0);
  document.getElementById("total").textContent = money(total);
}
function checkout() {
  if (cart.length === 0) {
    alert("Ajoute au moins un produit au panier.");
    return;
  }
  document.getElementById("checkoutSection").classList.remove("hidden");
  document.getElementById("checkoutSection").scrollIntoView({
    behavior: "smooth"
  });
}
function showCart() {
  document.getElementById("checkoutSection").classList.add("hidden");
  document.getElementById("cartSection").scrollIntoView({
    behavior: "smooth"
  });
}
function toggleAddress() {
  const mode = document.querySelector('input[name="mode"]:checked');
  document.getElementById("addressBox").classList.toggle(
    "hidden",
    !mode || mode.value !== "Livraison"
  );
}
function sendOrder() {
  if (cart.length === 0) {
    alert("Ton panier est vide.");
    return;
  }
  const mode = document.querySelector('input[name="mode"]:checked');
  if (!mode) {
    alert("Choisis la livraison ou le retrait sur place.");
    return;
  }
  const address = document.getElementById("address").value.trim();
  const details = document.getElementById("details").value.trim();
  if (mode.value === "Livraison" && !address) {
    alert("Entre ton adresse de livraison.");
    return;
  }
  let message = "Bonjour, voici ma commande :\n\n";
  cart.forEach(item => {
    message += "- " + item.name +
      " | grammes : " + item.q +
      " | Prix : " + money(item.price) + " €\n";
  });
  const total = cart.reduce((sum, item) => sum + item.price, 0);
  message += "\nTotal : " + money(total) + " €";
  message += "\nMode : " + mode.value;
  if (mode.value === "Livraison") {
    message += "\nAdresse : " + address;
    if (details) {
      message += "\nPrécisions : " + details;
    }
  }
  const username = SELLER_USERNAME.replace(/^@/, "").trim();
  if (!username || username === "TON_PSEUDO_TELEGRAM") {
    alert("Ajoute le pseudo Telegram du vendeur dans le code.");
    return;
  }
  const url = "https://t.me/" + username +
    "?text=" + encodeURIComponent(message);
  window.location.href = url;
}
renderCart();
</script>
</body>
</html>
